name: Build Godot Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 3.5.3 & Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_linux_headless.64.zip
          wget -q https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_export_templates.tpz
          
          unzip -q Godot_v3.5.3-stable_linux_headless.64.zip
          sudo mv Godot_v3.5.3-stable_linux_headless.64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          
          mkdir -p ~/.local/share/godot/templates/3.5.3.stable
          unzip -q Godot_v3.5.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/templates/3.5.3.stable/

      - name: Setup Android Keystore & Export Presets
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          
          mkdir -p ~/.config/godot
          cat << SETTINGS > ~/.config/godot/editor_settings-3.tres
          [gd_resource type="EditorSettings" format=2]
          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          
          cat << 'PRESET' > game/export_presets.cfg
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../build/Arv-go.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/use_custom_build=false
          architecture/armeabi-v7a=true
          architecture/arm64-v8a=true
          package/unique_name="com.jayesh.arvgo"
          package/name="Arv-go 2.0"
          PRESET

      - name: Build Android APK
        run: |
          mkdir -p build
          cd game
          godot --no-window -v --export-debug "Android" ../build/Arv-go.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arv-go-Debug-APK
          path: build/Arv-go.apk
