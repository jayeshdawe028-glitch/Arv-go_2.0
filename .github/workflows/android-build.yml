name: Build Godot Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:3.5.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android Debug Keystore & Export Presets
        run: |
          mkdir -p ~/.local/share/godot/templates/3.5.3.stable
          mv /root/.local/share/godot/templates/3.5.3.stable/* ~/.local/share/godot/templates/3.5.3.stable/ 2>/dev/null || true
          
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          
          cat << 'PRESET' > game/export_presets.cfg
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../build/Arv-go.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/use_custom_build=false
          architecture/armeabi-v7a=true
          architecture/arm64-v8a=true
          keystore/debug="debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          package/unique_name="com.jayesh.arvgo"
          package/name="Arv-go 2.0"
          PRESET

      - name: Build Android APK
        run: |
          mkdir -p build
          cd game
          godot -v --export-debug "Android" ../build/Arv-go.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arv-go-Debug-APK
          path: build/Arv-go.apk
